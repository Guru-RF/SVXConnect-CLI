# SVXConnect-CLI — example configuration
#
#   mkdir -p ~/.config/svxconnect
#   cp example.conf ~/.config/svxconnect/svxconnect.conf
#   $EDITOR ~/.config/svxconnect/svxconnect.conf
#
# Syntax:
#   '#' or ';' starts a comment anywhere on the line ('\#' is a literal hash).
#   Values may be wrapped in one layer of matched " or '.
#   Keys are case-insensitive. Booleans: on/off, yes/no, true/false, 1/0.
#   '~/' expands to your home directory in any path.
#
# `svxconnect --dump-config` prints every key with its resolved value, which
# is the fastest way to see what the program actually read.


# ================================================================= identity

callsign   = ON6URE              # your callsign; also the PKI filename stem
email      = you@example.com     # goes in the CSR so the sysop can reach you
reflector  = be.svx.link         # _svxreflector._tcp.<domain> SRV is tried first
port       = 5300                # ignored when an SRV record is found
pki_dir    = ~/.config/svxconnect/pki

# Your QTH, published to the reflector and shown on its portal map.
# Leave BOTH latitude and longitude unset to publish no position — that is
# supported and is better than a wrong one. Always use '.' as the decimal
# separator, whatever your locale.
latitude   = 51.0538
longitude  = 3.7250
location   = Gent


# ============================================================== talkgroups
#
# Notation:  <id> followed by zero or more '+' characters setting priority.
#
#     8      priority 0  (normal)
#     8+     priority 1
#     8++    priority 2  (highest)
#
# Priority only matters for automatic switching: a talker on a higher-priority
# talkgroup can pull you away from a lower-priority one. Priority 0 never
# preempts a talkgroup that is already busy.

# The talkgroups UP / DOWN arrow cycles through, in this order.
switchable = 8, 1745, 8000

# Everything you want to hear and see activity for. A talkgroup may appear in
# both lists; when it does, the priority given here is the one that counts.
monitored  = 8++, 1745+, 8000, 9990

default_tg     = 8         # selected on first run. 0 = start monitor-only.
lock_on_start  = off       # start with the talkgroup locked (no auto-switching)
linger_seconds = 30        # after a talker stops, hold this talkgroup this long
                           # before allowing a preemption — protects a QSO
                           # between overs. 10-300.
idle_seconds   = 60        # no traffic anywhere for this long -> drop to TG 0.
                           # 0 disables the idle drop.
tg_order       = numeric   # numeric | lastheard — sort order of the TG list


# =================================================================== audio

input_device       = default   # a name or id from `svxconnect --list-devices`
output_device      = default
output_volume_pct  = 100

mic_agc            = on        # level your microphone so you are neither
mic_agc_target_pct = 30        # inaudible nor clipping. 5-95; 30 ~= -22 dBm0.

jitter_ms          = 80        # playback buffer. Raise on a lossy or distant
                               # link; lower for snappier audio. 40-300.
tail_trim_ms       = 0         # discard this much audio when a talker stops,
                               # to cut a far-end repeater's squelch tail. 0-1000.

roger_beep         = on        # short beep when the other station unkeys
roger_beep_min_sec = 3         # ...but not for transmissions shorter than this

auto_duck          = off       # lower received audio while you transmit
auto_duck_quiet_pct = 5


# ===================================================================== ptt
#
# PTT is a TOGGLE: press SPACE to transmit, press SPACE again to stop.
# A terminal delivers characters, not key events — there is no key-release to
# hang hold-to-talk on. ESC always stops transmitting. See docs/PTT.md.

tx_timeout_sec = 120           # hard un-key after this long. 0 disables, but
                               # leaving it on is what stops a forgotten toggle
                               # from sitting on the talkgroup all afternoon.

# A named pipe for external control — a foot switch, a GPIO pin, a hotkey in
# your window manager, or just `echo`. Set to empty to disable.
#   echo "ptt on"  > ~/.local/state/svxconnect/ctl
#   echo "ptt off" > ~/.local/state/svxconnect/ctl
# Accepted: ptt on|off|toggle, tg <n>|next|prev, lock on|off|toggle,
#           mute <n>, unmute <n>, volume <0-100>, quit
ctl_fifo = ~/.local/state/svxconnect/ctl


# ====================================================================== ui

unicode       = on     # off = pure ASCII line drawing (same as --ascii)
show_log_pane = off
log_file      = ~/.local/state/svxconnect/svxconnect.log
log_level     = info   # err | warn | info | debug
